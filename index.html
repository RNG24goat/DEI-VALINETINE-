<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>hehehehhehehehhehehehehehhehehhehehehheheheh</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
      transition: background 3s ease; /* Sunset transition */
    }

    body.sunset {
      background: radial-gradient(circle at top, #ff9a9e, #fad0c4, #ffd1ff);
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      position: relative;
      z-index: 10;
    }

    .art-wrapper {
      position: relative;
      width: min(240px, 70vw);
      margin: 0 auto 10px;
    }

    .art {
      width: 100%;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    /* Animations */
    .heart-main { animation: pulse 1.2s infinite ease-in-out; transform-origin: center; }
    .cat { animation: bounce 2s infinite ease-in-out; transform-origin: center; }
    .whisker-l { animation: wiggleL 2s infinite ease-in-out; transform-origin: right; }
    .whisker-r { animation: wiggleR 2s infinite ease-in-out; transform-origin: left; }
    
    @keyframes wiggleL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } }
    @keyframes wiggleR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(10deg); } }

    #tail { animation: wag 1.5s infinite ease-in-out; transform-origin: 100px 220px; }
    @keyframes wag { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(15deg); } }

    #pawWave { display: none; transform-origin: 190px 210px; }
    .is-celebrating #pawWave { display: block; animation: wave 0.5s infinite ease-in-out; }
    @keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-25deg); } }

    /* Floating Hearts */
    .floating-heart {
      position: absolute;
      color: #ff3b7a;
      pointer-events: none;
      animation: floatUp 3s linear forwards;
      z-index: 100;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
    }

    /* Paw Prints */
    .paw-print {
      position: fixed;
      width: 20px;
      height: 20px;
      background: rgba(255, 59, 122, 0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      transform: translate(-50%, -50%);
      animation: fadeOut 1s forwards;
    }
    @keyframes fadeOut { to { opacity: 0; } }

    /* Speech Bubble */
    #speechBubble {
      position: absolute;
      top: -10px;
      right: -20px;
      background: white;
      border: 2px solid #ff7aa2;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #ff3b7a;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 100;
    }
    #speechBubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 15px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ff7aa2 transparent transparent;
    }

    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    h1 { font-size: clamp(24px, 5vw, 42px); margin: 12px 0 18px; color: #333; }

    .button-zone { position: relative; width: 100%; height: 250px; margin: 0 auto; touch-action: none; }

    button {
      position: absolute;
      top: 50%;
      padding: 16px 28px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn { left: 15%; background: var(--yes); color: #fff; z-index: 20; }
    #noBtn { right: 15%; background: #e5e7eb; color: #111827; z-index: 19; }

    .result { display: none; margin-top: 18px; animation: pop .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Decoration */
    .star { position: absolute; color: #ffd700; font-size: 20px; animation: pulse 2s infinite; }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <audio id="bgMusic">
    <source src="Frankie Valli - Can't Take My Eyes Off You (Official Audio) - RHINO.mp3" type="audio/mpeg">
  </audio>

  <div class="star" style="top:10%; left:10%;">✨</div>
  <div class="star" style="top:20%; right:15%;">⭐</div>
  <div class="star" style="bottom:15%; left:5%;">✨</div>

  <main class="card">
    <div class="art-wrapper" id="catArea">
      <div id="speechBubble">Nice try! 😋</div>
      <svg id="catSvg" class="art" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fur" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f7c7a1"/><stop offset="100%" stop-color="#f2a97b"/>
          </linearGradient>
          <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff4d7d"/><stop offset="100%" stop-color="#ff1f68"/>
          </linearGradient>
        </defs>
        
        <path id="tail" d="M100 220 Q70 200 80 170" stroke="#f2a97b" stroke-width="12" fill="none" stroke-linecap="round" />

        <path class="heart-main" d="M160 38 C160 22 182 22 192 38 C202 22 224 24 224 44 C224 72 192 88 192 100 C192 88 160 72 160 38Z" fill="url(#heartGrad)"/>
        
        <g class="cat">
          <ellipse cx="160" cy="195" rx="90" ry="65" fill="url(#fur)"/>
          <circle cx="160" cy="135" r="55" fill="url(#fur)"/>
          <polygon points="112,98 92,52 140,82" fill="#f2a97b"/>
          <polygon points="208,98 228,52 180,82" fill="#f2a97b"/>
          
          <circle cx="125" cy="148" r="7" fill="#ffb3c1" opacity="0.6"/>
          <circle cx="195" cy="148" r="7" fill="#ffb3c1" opacity="0.6"/>

          <g stroke="#444" stroke-width="2" stroke-linecap="round">
            <line class="whisker-l" x1="110" y1="140" x2="80" y2="135" />
            <line class="whisker-l" x1="110" y1="150" x2="80" y2="155" />
            <line class="whisker-r" x1="210" y1="140" x2="240" y2="135" />
            <line class="whisker-r" x1="210" y1="150" x2="240" y2="155" />
          </g>

          <circle id="eyeL" cx="145" cy="135" r="6" fill="#000"/>
          <circle id="eyeR" cx="175" cy="135" r="6" fill="#000"/>
          <path id="eyeWink" d="M168 135 Q175 142 182 135" stroke="#000" stroke-width="3" fill="none" style="display:none;" stroke-linecap="round"/>

          <polygon points="160,145 152,155 168,155" fill="#ff7aa2"/>
          <path d="M160 155 C154 162 144 162 140 158" stroke="#000" stroke-width="2" fill="none"/>
          <path d="M160 155 C166 162 176 162 180 158" stroke="#000" stroke-width="2" fill="none"/>
          
          <circle id="pawWave" cx="210" cy="190" r="12" fill="url(#fur)" stroke="#f2a97b" stroke-width="1"/>
        </g>
      </svg>
    </div>

    <h1>Riddhi, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint"> If you clicked “No”, js say you hate me twin 😈</div>

    <section class="result" id="result">
      <h2>YAYYYYY! 🎺❤️</h2>
      <p>I LOVE YOU RIDDHIIIII SEE U ON 13TH :3.</p>
      <img class="fireworks" src="https://media.giphy.com/media/W1hd3uXRIbddu/giphy.gif" alt="Fireworks" width="300" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const music = document.getElementById("bgMusic");
    const confettiCanvas = document.getElementById("confettiCanvas");
    const bubble = document.getElementById("speechBubble");
    const catSvg = document.getElementById("catSvg");
    const eyeR = document.getElementById("eyeR");
    const eyeWink = document.getElementById("eyeWink");
    const catArea = document.getElementById("catArea");

    const messages = ["Nuh uh! 🐾", "Wrong Button!", "Bruh!", "Try again! 😜", "Hehehe!", "WHY!"];

    // Sound Synthesizer (Meow/Kiss)
    const playSound = (type) => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if(type === 'meow') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);
      }
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    };

    // Paw trail logic
    catArea.addEventListener('mousemove', (e) => {
      if(Math.random() > 0.8) {
        const paw = document.createElement('div');
        paw.className = 'paw-print';
        paw.style.left = e.clientX + 'px';
        paw.style.top = e.clientY + 'px';
        document.body.appendChild(paw);
        setTimeout(() => paw.remove(), 1000);
      }
    });

    function spawnHeart() {
      const h = document.createElement('div');
      h.className = 'floating-heart';
      h.innerHTML = '💕';
      h.style.left = (Math.random() * 60 + 20) + '%';
      h.style.top = '40%';
      catArea.appendChild(h);
      setTimeout(() => h.remove(), 3000);
    }

    // CONFETTI SETUP
    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    function fullScreenConfetti() {
      const end = Date.now() + 3000;
      (function frame() {
        confettiInstance({ particleCount: 8, spread: 80, origin: { x: Math.random(), y: Math.random() * 0.4 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    // RUN AWAY LOGIC
    let yesScale = 1;
    function moveNo() {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const maxX = z.width - b.width;
      const maxY = z.height - b.height;

      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
      noBtn.style.right = "auto";
      noBtn.style.transform = "none";

      yesScale = Math.min(2.5, yesScale + 0.15);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;

      bubble.innerText = messages[Math.floor(Math.random() * messages.length)];
      bubble.style.opacity = "1";
      setTimeout(() => { bubble.style.opacity = "0"; }, 800);
      spawnHeart();
    }

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNo(); });

    // YES CLICK
    yesBtn.addEventListener("click", () => {
      playSound('meow');
      setTimeout(() => playSound('kiss'), 300);
      
      music.currentTime = 69; 
      music.play().catch(e => console.log("Playback failed:", e));

      music.addEventListener("timeupdate", function() {
        if (this.currentTime >= 125) { this.pause(); }
      });

      document.body.classList.add('sunset');
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      document.querySelector('h1').style.display = "none";
      
      catSvg.classList.add('is-celebrating');
      eyeR.style.display = "none";
      eyeWink.style.display = "block";
      
      setInterval(spawnHeart, 400);
      fullScreenConfetti();
    });
  </script>
</body>
</html>
